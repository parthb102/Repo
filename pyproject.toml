[project]
name = "nosleep-reader"
version = "0.1.0"
description = "Read top r/nosleep stories from any time window in a clean reader UI."
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "httpx>=0.27",
    "markdown-it-py>=3.0",
    "python-dateutil>=2.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
